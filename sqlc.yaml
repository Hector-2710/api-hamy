version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/repository/postgres/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/repository/postgres/sqlcgen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
